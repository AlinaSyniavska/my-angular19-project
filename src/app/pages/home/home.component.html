<app-reaction-picker [reactions]="reactions()" />

<section class="buttons">
  <button
    class="primary"
    (click)="reactions.set(['😡', '😠', '😐', '😊', '😍'])"
  >More Reactions</button>

  <button
    class="secondary"
    (click)="reactions.set(['😠', '😐', '😊'])"
  >Less Reactions</button>
</section>
